<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#24273a" />
    <!-- Only the translation services may be contacted; everything else is served from this site. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' https://firefox-settings-attachments.cdn.mozilla.net https://translate.googleapis.com https://api.mymemory.translated.net https://mozhi.adminforge.de https://mozhi.ducks.party https://mozhi.pussthecat.org https://apertium.org http://localhost:* http://127.0.0.1:* https://localhost:*; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <title>Fairtaler Translate</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23c6a0f6'/%3E%3Cg fill='none' stroke='%23181926' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4.6 5H19.4Q18.4 9.6 13.6 12.4' /%3E%3Cpath d='M12 8.4Q12.3 16.4 6 20.6' /%3E%3C/g%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Fairtaler Translate home">
        <span class="brand-mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 5H19.4Q18.4 9.6 13.6 12.4" /><path d="M12 8.4Q12.3 16.4 6 20.6" /></svg></span>
        <span class="brand-name">Fairtaler Translate</span>
      </a>
    </header>

    <main class="page">

      <section class="card" id="card">
        <div class="langbar" id="langbar">
          <div class="langside src" id="src-side"></div>
          <div class="swap-wrap">
            <button class="icon-btn swap" type="button" id="swap" aria-label="Swap languages" title="Swap languages (Ctrl+Shift+S)"></button>
          </div>
          <div class="langside tgt" id="tgt-side"></div>
        </div>

        <div class="picker" id="picker" hidden>
          <div class="picker-head">
            <button class="icon-btn" type="button" id="picker-back" aria-label="Back"></button>
            <input class="picker-search" id="picker-search" type="text" placeholder="Search languages" aria-label="Search languages" autocomplete="off" spellcheck="false" />
            <button class="icon-btn" type="button" id="picker-clear" aria-label="Clear search" hidden></button>
          </div>
          <div class="picker-body" id="picker-body"></div>
        </div>

        <div class="panes" id="panes">
          <div class="pane src-pane">
            <div class="ta-wrap">
              <textarea id="source" class="source" rows="1" maxlength="5000" spellcheck="false" aria-label="Source text" placeholder="Enter text"></textarea>
              <button class="icon-btn clear-btn" type="button" id="clear" aria-label="Clear source text" hidden></button>
            </div>
            <div class="ime-bar" id="ime-bar" role="listbox" aria-label="Japanese suggestions" hidden></div>
            <div class="pane-foot">
              <div class="foot-left">
                <button class="icon-btn" type="button" id="listen-src" aria-label="Listen" hidden></button>
                <button class="icon-btn ime-toggle" type="button" id="ime-toggle" aria-pressed="true" title="Type romaji to write Japanese" hidden>あ</button>
                <button class="icon-btn" type="button" id="draw-btn" aria-label="Draw a character" aria-expanded="false" aria-controls="draw-pop" title="Draw a kanji or kana" hidden></button>
              </div>
              <span class="count" id="count">0 / 5,000</span>
            </div>
            <div class="draw-pop" id="draw-pop" role="dialog" aria-label="Draw a character" hidden>
              <div class="info-head">
                <h3>Draw a character</h3>
                <button class="icon-btn" type="button" id="draw-close" aria-label="Close"></button>
              </div>
              <div class="draw-body">
                <canvas id="draw-canvas" class="draw-canvas" width="256" height="256" aria-label="Drawing area"></canvas>
                <div class="draw-side">
                  <div class="draw-cands" id="draw-cands"></div>
                  <p class="draw-status" id="draw-status"></p>
                  <div class="draw-actions">
                    <button class="text-btn" type="button" id="draw-undo">Undo</button>
                    <button class="text-btn" type="button" id="draw-clear">Clear</button>
                  </div>
                </div>
              </div>
              <p class="jp-credit draw-credit">Handwriting: KanjiCanvas (MIT), strokes from KanjiVG (CC BY-SA 3.0).</p>
            </div>
          </div>
          <div class="pane tgt-pane" id="tgt-pane">
            <div class="output-wrap">
              <div class="output-scroll" id="output-scroll">
                <div class="output is-empty" id="output" aria-live="polite">Translation</div>
                <div class="jp-extra" id="jp-extra" hidden>
                  <div class="jp-reading" id="jp-reading" lang="ja"></div>
                </div>
              </div>
              <button class="icon-btn save-btn" type="button" id="save" aria-label="Save translation" hidden></button>
            </div>
            <div class="pane-foot" id="tgt-foot" hidden>
              <div class="foot-left">
                <button class="icon-btn" type="button" id="listen-tgt" aria-label="Listen"></button>
              </div>
              <div class="foot-right">
                <button class="icon-btn" type="button" id="copy" aria-label="Copy translation"></button>
                <button class="icon-btn" type="button" id="info" aria-label="More about this translation" aria-expanded="false" aria-controls="info-pop"></button>
              </div>
            </div>
            <div class="info-pop" id="info-pop" role="dialog" aria-label="About this translation" hidden>
              <div class="info-head">
                <h3 id="info-title">Kanji</h3>
                <button class="icon-btn" type="button" id="info-close" aria-label="Close"></button>
              </div>
              <div class="info-body">
                <p class="info-empty" id="info-empty" hidden></p>
                <ul class="jp-kanji" id="jp-kanji"></ul>
                <p class="jp-credit" id="jp-credit">Kanji meanings: KANJIDIC (EDRDG, CC BY-SA 4.0). Readings: kuromoji.</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <div class="shortcuts">
        <button class="shortcut" type="button" id="open-history">
          <span class="shortcut-circle" data-icon="history"></span>
          <span class="shortcut-label">History</span>
        </button>
        <button class="shortcut" type="button" id="open-saved">
          <span class="shortcut-circle" data-icon="star"></span>
          <span class="shortcut-label">Saved</span>
        </button>
        <button class="shortcut" type="button" id="open-voices">
          <span class="shortcut-circle" data-icon="voice"></span>
          <span class="shortcut-label">Voices</span>
        </button>
        <button class="shortcut" type="button" id="open-source">
          <span class="shortcut-circle" data-icon="source"></span>
          <span class="shortcut-label">Source</span>
        </button>
      </div>
    </main>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawer-title">
      <div class="drawer-head">
        <div class="drawer-title-row">
          <h2 id="drawer-title">History</h2>
          <button class="switch" type="button" id="history-switch" role="switch" aria-checked="false" aria-label="Save history" title="Save history" hidden><span class="switch-knob"></span></button>
        </div>
        <button class="icon-btn" type="button" id="drawer-close" aria-label="Close"></button>
      </div>
      <div class="drawer-tools" id="drawer-tools"></div>
      <div class="drawer-list" id="drawer-list"></div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
